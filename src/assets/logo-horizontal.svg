<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 76" width="480" height="76" fill="none">
  <defs>
    <linearGradient id="hGoldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF6D4"/>
      <stop offset="25%" stop-color="#ECD07B"/>
      <stop offset="60%" stop-color="#D5AA54"/>
      <stop offset="100%" stop-color="#8F641B"/>
    </linearGradient>

    <linearGradient id="hForestGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#225447"/>
      <stop offset="45%" stop-color="#173F35"/>
      <stop offset="100%" stop-color="#0D2620"/>
    </linearGradient>

    <linearGradient id="hCyanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#76E7FD"/>
      <stop offset="35%" stop-color="#3DC3DF"/>
      <stop offset="75%" stop-color="#249BB2"/>
      <stop offset="100%" stop-color="#147587"/>
    </linearGradient>

    <linearGradient id="hTerraGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BF4433"/>
      <stop offset="55%" stop-color="#983224"/>
      <stop offset="100%" stop-color="#731F14"/>
    </linearGradient>

    <filter id="hShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#071914" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Left Emblem (64x64) -->
  <g id="h-emblem" transform="translate(6, 6)" filter="url(#hShadow)">
    <circle cx="32" cy="32" r="30" fill="url(#hForestGrad)" stroke="url(#hGoldGrad)" stroke-width="2.4"/>
    <circle cx="32" cy="32" r="26.5" fill="none" stroke="#D5AA54" stroke-width="0.7" stroke-dasharray="2.5 1.5" opacity="0.65"/>

    <path d="M 14 44 Q 32 50 50 44" stroke="#3DC3DF" stroke-width="1.8" stroke-linecap="round" fill="none" opacity="0.75"/>
    <path d="M 17 48 Q 32 53 47 48" stroke="#D5AA54" stroke-width="1.3" stroke-linecap="round" fill="none" opacity="0.55"/>

    <polygon points="15,17 20,17 24,42 19,42" fill="url(#hGoldGrad)"/>
    <polygon points="49,17 44,17 40,42 45,42" fill="url(#hGoldGrad)"/>
    <polygon points="22,17 27,17 32,38 29,41" fill="url(#hGoldGrad)"/>
    <polygon points="42,17 37,17 32,38 35,41" fill="url(#hGoldGrad)"/>

    <polygon points="30.5,38 33.5,38 32,49" fill="#FFF6D4" stroke="#8F641B" stroke-width="0.5"/>

    <line x1="18" y1="24" x2="46" y2="24" stroke="#8F641B" stroke-width="1.1" stroke-linecap="round"/>
    <line x1="20" y1="32" x2="44" y2="32" stroke="#8F641B" stroke-width="1.1" stroke-linecap="round"/>

    <path d="M 32 20 C 27.5 26, 25 30, 25 34 C 25 38, 28 41, 32 41 C 36 41, 39 38, 39 34 C 39 30, 36.5 26, 32 20 Z"
          fill="url(#hCyanGrad)"/>
    <path d="M 28.5 30 C 27 32, 27 35, 29.5 37" stroke="#FFFFFF" stroke-width="1" stroke-linecap="round" fill="none" opacity="0.85"/>

    <circle cx="32" cy="15" r="3" fill="url(#hGoldGrad)" stroke="#0D2620" stroke-width="0.7"/>
  </g>

  <!-- Right Typography Lockup -->
  <!-- Line 1: WERNER + & SONS -->
  <g id="h-top-row">
    <!-- WERNER -->
    <text x="86" y="37"
          font-family="'Montserrat', 'Inter', -apple-system, sans-serif"
          font-size="34"
          font-weight="900"
          letter-spacing="2.5"
          fill="#173F35">WERNER</text>

    <!-- & SONS Badge -->
    <g transform="translate(270, 14)">
      <rect x="0" y="0" width="98" height="25" rx="12.5" ry="12.5"
            fill="url(#hTerraGrad)"
            stroke="url(#hGoldGrad)"
            stroke-width="1.4"/>
      <text x="49" y="17"
            text-anchor="middle"
            font-family="'Inter', -apple-system, sans-serif"
            font-size="11.5"
            font-weight="800"
            letter-spacing="2"
            fill="#FFFFFF">&amp; SONS</text>
    </g>
  </g>

  <!-- Line 2: WELL DRILLING Cyan Banner -->
  <g id="h-bottom-row" transform="translate(86, 45)">
    <rect x="0" y="0" width="282" height="24" rx="12" ry="12"
          fill="url(#hCyanGrad)"
          stroke="#0D2620"
          stroke-width="1.3"/>
    <path d="M 14 2.5 L 268 2.5" stroke="#FFFFFF" stroke-width="0.8" stroke-linecap="round" opacity="0.45"/>
    <text x="141" y="16.5"
          text-anchor="middle"
          font-family="'Montserrat', 'Inter', -apple-system, sans-serif"
          font-size="13"
          font-weight="900"
          letter-spacing="4"
          fill="#0D2620">WELL DRILLING</text>
  </g>
</svg>
